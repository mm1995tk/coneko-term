name: 検査

# flake の checks（nix flake check）を Linux と macOS で回す。手元の nix flake check と同じもの:
#   formatting … nix fmt で差分が出ない
#   cargo-test … cargo test（全 crate）
#   npm        … npm パッケージを作り、その中で TypeScript のテスト（npm test）を回す

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    strategy:
      fail-fast: false
      matrix:
        # macOS の Runner が確保できず打ち切られるので、戻せるまで外す。
        # os: [ubuntu-latest, macos-latest]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - name: nix flake check
        run: nix flake check --print-build-logs
      - name: nix fmt で差分が出ないこと
        run: |
          nix fmt
          git diff --exit-code

  # 公開の予行。リリースを起動する前に、crates.io と npm が受け取れる形かを確かめる。
  # release.yml と同じ手順で、公開だけしない。ネットワークが要るので nix flake check には入れない
  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.3
      - name: 版がそろっている
        run: nix develop -c sh scripts/check-release-version.sh
      - name: cargo publish --dry-run
        run: nix develop -c cargo publish -p coneko-term --locked --dry-run
      - name: npm publish --dry-run
        run: |
          nix build .#npm --out-link npm-package
          nix develop -c npm publish ./npm-package/*.tgz --access public --dry-run
